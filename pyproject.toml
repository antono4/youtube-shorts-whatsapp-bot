[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-shorts-whatsapp-bot"
description = "Auto-generates Indonesian YouTube Shorts scripts and delivers them via WhatsApp"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dynamic = ["version"]
dependencies = [
    "pywhatkit>=5.4",
    "selenium>=4.15.0",
    "webdriver-manager>=4.0.1",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
yts-bot = "whatsapp_bot.whatsapp_bot:cli"
yts-generate = "youtube_shorts_generator.youtube_shorts_generator:main"

[tool.setuptools]
packages = ["whatsapp_bot", "youtube_shorts_generator"]

[tool.setuptools.dynamic]
version = { attr = "whatsapp_bot.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
